<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav>
      <div class="shopping-cart-icon">
        <button id="cart-btn" aria-label="Shopping cart">
          <a href="#shopping-cart-details">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="feather feather-shopping-cart"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
          </a>
          <span id="item-count">3</span>
        </button>
      </div>
    </nav>
    <main>
      <h1>Shopping Cart Demo</h1>
    </main>
    <section id="shopping-cart-details">
        <h2>Your Cart</h2>
      <!-- <button id="cart-btn" aria-label="Shopping cart">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="feather feather-shopping-cart"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          ></path>
        </svg>
        <span id="item-count">3</span>
      </button> -->
      <ul class="cart-items">
        <li class="cart-item">
          <span class="item-name">T-Shirt</span>
          <input
            type="number"
            min="1"
            value="2"
            class="quantity-input"
            aria-label="Quantity for T-Shirt"
          />
          <button class="remove-btn">Remove</button>
        </li>
        <li class="cart-item">
          <span class="item-name">Hat</span>
          <input
            type="number"
            min="1"
            value="1"
            class="quantity-input"
            aria-label="Quantity for Hat"
          />
          <button class="remove-btn">Remove</button>
        </li>
      </ul>
      <div id="cart-details">
        <ul id="cart-items">
          <li>T-Shirt x2 - $40.00</li>
          <li>Hat x1 - $15.00</li>
        </ul>
        <div id="cart-total">Total: <strong>$55.00</strong></div>
        <button id="checkout-btn">Proceed to Checkout</button>
      </div>
    </section>
  </body>
</html>
