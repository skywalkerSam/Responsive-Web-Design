<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Bar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Progress indication Bar Demo</h1>

      <form id="multiStepForm">
        <!-- <div class="form-progress">
          <label class="progress-label">Form progress</label>
          <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-text">Step 1 of 3</div>
          </div>
        </div> -->
        <div class="form-progress" aria-label="Form progress">
          <label class="progress-label"
            >Step <span id="currentStep">1</span> of
            <span id="totalSteps">4</span> (<span id="percentage">25%</span
            >)</label
          >
          <div
            class="progress-container"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="25"
          >
            <div class="progress-bar"></div>
          </div>
        </div>

        <!-- Step 1 -->
        <fieldset class="form-step active">
          <legend>Personal Information</legend>
          <label for="name">Full Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Jane Doe"
          />

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="janedoe@hotmail.com"
          />

          <button type="button" class="next-btn">Next</button>
        </fieldset>

        <!-- Step 2 -->
        <fieldset class="form-step">
          <legend>Address</legend>
          <label for="address">Street Address:</label>
          <input
            type="text"
            id="address"
            name="address"
            required
            placeholder="12th Street, Queens Road"
          />

          <label for="city">City:</label>
          <input
            type="text"
            id="city"
            name="city"
            required
            placeholder="New York"
          />

          <button type="button" class="prev-btn">Previous</button>
          <button type="button" class="next-btn">Next</button>
        </fieldset>

        <!-- Step 3 -->
        <fieldset class="form-step">
          <legend>Review & Submit</legend>
          <p>Please review your information before submitting.</p>

          <button type="button" class="prev-btn">Previous</button>
          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
